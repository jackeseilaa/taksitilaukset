<div class="v-tag" id="statusHeader">VERSIO 37.1 | PÄIVITETTY: --:--</div>
<h1>KULJETUSKIRJA</h1>

<script type="module">

    function startListening() {
        onSnapshot(query(collection(db, "taksitulot")), (snap) => {
            // Päivitetään status-kello kun dataa tulee
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0');
            document.getElementById('statusHeader').innerText = `VERSIO 37.1 | PÄIVITETTY: ${timeStr}`;

            const tbody = document.getElementById('logs');
            tbody.innerHTML = '';
            // ... (muu logiikka ennallaan)
        });
    }

</script>
