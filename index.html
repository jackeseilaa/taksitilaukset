<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Kuljetuskirja V39.0</title>
    <style>
        :root { --bg: #000; --accent: #c8f050; --text: #fff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { padding: 8px; border-bottom: 1px solid #333; font-size: 0.9rem; }
        .is-dup { background: #4a0000; } /* Duplikaattien väri */
        .btn { width: 48%; padding: 10px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="statusHeader">V39.0</div>
    <div style="display:flex; justify-content:space-between;">
        <button class="btn" onclick="exportCSV(false)">Lataa erittely</button>
        <button class="btn" style="background:#555" onclick="exportCSV(true)">Lataa KAIKKI</button>
    </div>
    <table id="logsTable"><tbody id="logs"></tbody></table>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBVPk5FmqbVmirWpjnTQswfNDoUK2SoWzs", authDomain: "jsailing-f716c.firebaseapp.com", projectId: "jsailing-f716c", storageBucket: "jsailing-f716c.firebasestorage.app", appId: "1:543523103696:web:439a312efa6aec398a8fd5" }));
    
    let currentLogs = [];

    onSnapshot(collection(db, "taksitulot"), (snap) => {
        let raw = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        // Tunnistetaan duplikaatit vertaamalla kenttiä
        currentLogs = raw.map((item, index, self) => {
            const isDup = self.findIndex(i => i.date === item.date && i.time === item.time && i.from === item.from && i.to === item.to) !== index;
            return { ...item, isDup };
        });
        
        const tbody = document.getElementById('logs');
        tbody.innerHTML = '';
        currentLogs.forEach(r => {
            const tr = document.createElement('tr');
            if (r.isDup) tr.className = 'is-dup';
            tr.innerHTML = `<td>${r.date} ${r.time}</td><td>${r.from} ⮕ ${r.to}</td><td>${r.auto||''}</td>`;
            tbody.appendChild(tr);
        });
    });

    window.exportCSV = (all) => {
        let csv = "\uFEFFPvm;Klo;Auto;Matkustaja;Reitti;Hinta\n";
        currentLogs.forEach(r => {
            const a = (r.auto || "").trim();
            if (all || (a !== "" && !/^\d+$/.test(a))) {
                csv += `${r.date||''};${r.time||''};${a};${r.customer||''};${r.from||''}-${r.to||''};${r.price||''}\n`;
            }
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = all ? "kaikki_tiedot.csv" : "erittely.csv";
        link.click();
    };
</script>
</body>
</html>
