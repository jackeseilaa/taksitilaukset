<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuljetuskirja V36.9.2</title>
    <style>
        :root { --bg: #000; --accent: #c8f050; --text: #fff; }
        body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); padding: 10px; }
        .status { color: #888; font-size: 10px; text-align: center; margin-bottom: 5px; }
        .auto-tag { background: #fff; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 900; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { padding: 8px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div class="status" id="statusHeader">ODOTETAAN TIETOKANTAA...</div>
    <div id="logs">Ladataan...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({ 
        apiKey: "AIzaSyBVPk5FmqbVmirWpjnTQswfNDoUK2SoWzs", 
        authDomain: "jsailing-f716c.firebaseapp.com", 
        projectId: "jsailing-f716c", 
        storageBucket: "jsailing-f716c.firebasestorage.app", 
        appId: "1:543523103696:web:439a312efa6aec398a8fd5" 
    }));

    // Tässä haetaan dataa. Jos tämä ei tuo mitään, tarkista Firebase-konsolista onko "taksitulot" kokoelma siellä.
    const q = query(collection(db, "taksitulot"));
    
    onSnapshot(q, (snap) => {
        const now = new Date();
        document.getElementById('statusHeader').innerText = `VERSIO 36.9.2 | PÄIVITETTY: ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
        
        if (snap.empty) {
            document.getElementById('logs').innerHTML = "Tietokanta löytyi, mutta se on TYHJÄ.";
            return;
        }

        let html = '<table><thead><tr><th>PVM/KLO/AUTO</th><th>REITTI</th><th>HINTA</th></tr></thead><tbody>';
        snap.forEach(doc => {
            const r = doc.data();
            const auto = (r.vehicle || r.auto || "-");
            html += `<tr>
                <td><b>${r.date || '-'}</b><br>${r.time || '-'}<br><span class="auto-tag">${auto}</span></td>
                <td>${r.from || '-'} ⮕ ${r.to || '-'}</td>
                <td>${r.price || '0'}€</td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('logs').innerHTML = html;
    }, (err) => {
        document.getElementById('logs').innerHTML = "Virhe yhteydessä: " + err.message;
    });
</script>
</body>
</html>
