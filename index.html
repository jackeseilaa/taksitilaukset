 <style>
 :root { 
 --bg: #000000; --surface: #111111; --border: #333333; --accent: #c8f050; 
 --accent2: #50c8f0; --text: #ffffff; --muted: #aaaaaa; --price-bg: #ffff00; --price-text: #000000;
 --edit-mode: #1a3a1a; --edit-accent: #80ff80; --del: #ff4444;
 }
 * { box-sizing: border-box; margin: 0; padding: 0; }
 body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); padding: 10px; line-height: 1.4; }
 .v-tag { color: var(--muted); font-size: 11px; text-align: center; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
 h1 { font-family: 'Syne', sans-serif; font-size: 1.2rem; text-align: center; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
 .edit-mode-indicator { display: none; text-align: center; background: var(--edit-mode); border: 2px solid var(--edit-accent); color: var(--edit-accent); padding: 8px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
 .edit-mode-indicator.active { display: block; }
 textarea { width: 100%; background: var(--surface); border: 2px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px; font-family: inherit; margin-bottom: 10px; min-height: 100px; font-size: 1rem; border-left: 6px solid var(--accent); outline: none; }
 .manual-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; background: #1a1a1a; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
 .manual-fields input { background: #000; border: 1px solid #555; color: #fff; padding: 12px; border-radius: 4px; font-family: inherit; font-size: 0.9rem; width: 100%; }
 .full-width { grid-column: span 2; }
 label { font-size: 0.7rem; color: var(--accent2); text-transform: uppercase; margin-bottom: 3px; display: block; font-weight: bold; }
 .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
 .btn-add { background: var(--accent); color: black; flex: 2; padding: 20px; border-radius: 8px; font-weight: 900; border: none; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; min-width: 200px; }
 .btn-csv { background: #333; color: white; flex: 1; border-radius: 8px; border: 2px solid #444; cursor: pointer; font-size: 0.8rem; font-weight: bold; min-width: 140px; padding: 10px; }
 .btn-csv:hover { background: #444; }
 .btn-csv.export-all { background: #2a4a2a; border-color: #4a8a4a; }
 .btn-csv.export-date { background: #4a2a2a; border-color: #8a4a4a; }
 .btn-csv.export-subscriber { background: #2a3a4a; border-color: #4a6a8a; }
 .btn-cancel { background: #4a3333; color: #ff8080; flex: 1; border-radius: 8px; border: 2px solid #6a4444; cursor: pointer; font-size: 0.8rem; font-weight: bold; display: none; padding: 10px; }
 .btn-cancel.show { display: block; }
 .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
 .modal-overlay.active { display: flex; }
 .modal-box { background: var(--surface); border: 2px solid var(--accent); border-radius: 8px; padding: 20px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; }
 .modal-title { color: var(--accent); font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; }
 .modal-field { margin-bottom: 12px; }
 .modal-field label { display: block; margin-bottom: 5px; }
 .modal-field input { width: 100%; background: #000; border: 1px solid #555; color: #fff; padding: 10px; border-radius: 4px; font-family: inherit; }
 .modal-buttons { display: flex; gap: 8px; margin-top: 15px; }
 .modal-btn { flex: 1; padding: 10px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
 .modal-btn.ok { background: var(--accent); color: black; }
 .modal-btn.cancel { background: #444; color: #fff; }
 .table-wrapper { overflow-x: auto; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
 table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 1400px; }
 th { text-align: left; color: #ffffff; padding: 15px 10px; border-bottom: 2px solid var(--accent); background: #000; text-transform: uppercase; font-weight: 900; }
 td { padding: 12px 10px; border-bottom: 1px solid #333; vertical-align: top; }
 a { color: #50c8f0; text-decoration: underline; }
 .price-tag { font-weight: 900; color: #000000; background: #ff9900; padding: 4px 8px; border-radius: 4px; }
 .action-btn { background: #222; border: 1px solid #444; font-size: 1.1rem; cursor: pointer; color: var(--accent2); padding: 6px 10px; border-radius: 4px; margin-right: 5px; }
 .del-btn { color: var(--del); border-color: var(--del); }
 .error-msg { color: #ff6666; font-size: 0.9rem; margin-top: 5px; }
 @keyframes missingFlash { 0%, 100% { background: #000; border-color: #555; box-shadow: none; } 50% { background: #b00020; border-color: #ff4d4d; box-shadow: 0 0 10px 2px #ff1a1a; } }
 .flash-missing { animation: missingFlash 0.35s ease-in-out 2; }
 </style>
</head>
<body>
<div id="auth-overlay" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#000;color:#fff;flex-direction:column;gap:16px;padding:20px;text-align:center;">
    <h1 style="font-family:'Syne',sans-serif;color:#c8f050;letter-spacing:2px;">KULJETUSKIRJA</h1>

    <button id="btnLogin" style="padding:14px 28px;font-size:16px;font-weight:700;border:none;border-radius:8px;background:#c8f050;color:#000;cursor:pointer;font-family:'DM Mono',monospace;">Kirjaudu Googlella</button>
    <p id="auth-error" style="color:#ff4444;min-height:20px;margin:0;font-size:13px;"></p>
</div>
<div id="app-root" style="display:none;">
<div class="v-tag">V37.55 | Päivitetty: 23.10.2026</div>
<h1>KULJETUSKIRJA</h1>
<div class="edit-mode-indicator" id="editModeIndicator">✎ MUOKKAA-TILA AKTIIVINEN</div>
<textarea id="msgInput" placeholder="LIITÄ VIESTI TÄHÄN..." oninput="parseMessage()"></textarea>
<div class="manual-fields">
 <div><label>Pvm</label><input type="text" id="inPvm" placeholder="pp.kk.yyyy"></div>
 <div><label>Klo</label><input type="text" id="inKlo" placeholder="hh:mm"></div>

 <div><label>Hinta (€)</label><input type="text" id="inHinta" style="background:#ffff00; color:#000; font-weight:bold;" placeholder="0.00"></div>
 <div><label>Tyyppi</label><input type="text" id="inTyyppi"></div>
 <div class="full-width"><label>Lähtö</label><input type="text" id="inFrom"></div>
 <div class="full-width"><label>Meno</label><input type="text" id="inTo"></div>

 <div><label>Puhelin</label><input type="text" id="inPuhelin" placeholder="+358..."></div>
 <div><label>Tilaaja</label><input type="text" id="inTilaaja"></div>
 <div class="full-width"><label>Lasku / Maksaja</label><input type="text" id="inLasku"></div>
 <div class="full-width"><label>Huomio</label><input type="text" id="inHuomio"></div>
 <div class="full-width"><label>Poikkeamat</label><input type="text" id="inPoikkeama"></div>

<div class="btn-row">
 <button class="btn-add" id="btnSave">TALLENNA TILAUS</button>
 <a class="btn-csv" href="https://docs.google.com/spreadsheets/d/1Ijy9r9DGPW4nqsODaVZ5vJAD0m0fqsfED8eysWGuDG4/edit" target="_blank" rel="noopener" style="background:#1a73e8;border-color:#4a90f0;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;">AVAA TAKSI-SHEETS</a>
 <button class="btn-csv export-all" onclick="window.downloadAllCSV()">LATAA KOKO CSV</button>
 <button class="btn-csv export-date" id="btnSetSMB" style="background: #2a4a2a;">ASETA SMB TÄNÄÄN</button>
 <button class="btn-csv export-date" onclick="openExportModal('date')">LATAA PÄIVÄ/AIKAVÄLI</button>
 <button class="btn-csv export-subscriber" onclick="exportSubscriberCSV()">LATAA LASKUTETTAVAT (EXCEL)</button>
 <button class="btn-csv export-subscriber" onclick="openShiftModal()">LASKULIITE: AJOVUOROT (EXCEL)</button>
 <button class="btn-csv" id="btnClear" onclick="clearForm()" style="background: #3a2a2a;">TYHJENNÄ</button>

 <div class="modal-box">
 <div class="modal-title">Lataa CSV</div>
 <div class="modal-field" id="modeSelector">
 <label>Valitse:</label>
 <select id="exportMode" style="width:100%; background:#000; border:1px solid #555; color:#fff; padding:10px; border-radius:4px; font-family:inherit;">
 <option value="today">Vain tänään</option>

 <div class="modal-box" style="max-width:520px;">
 <div class="modal-title">Laskuliite: ajovuorot (Taksipalvelu Simonen)</div>
 <div class="modal-field"><label>Alkupäivä (pp.kk.yyyy)</label><input type="text" id="shiftFrom" placeholder="12.10.2026"></div>
 <div class="modal-field"><label>Loppupäivä (pp.kk.yyyy)</label><input type="text" id="shiftTo" placeholder="23.10.2026"></div>
 <div class="modal-buttons" style="margin-top:0;"><button class="modal-btn ok" onclick="loadShifts()">HAE VUOROT</button></div>
 <div class="modal-field" id="shiftList" style="margin-top:12px;"></div>
 <div class="modal-field" id="shiftSummary" style="display:none; border-top:1px solid #555; padding-top:8px;"></div>

 </div>

<div style="text-align: center; color: #c8f050; font-size: 0.9rem; margin-bottom: 10px; font-weight: bold;">
 📊 Ladattu: <span id="dataCount">0</span> tilausta Firestore:sta
</div>
<div class="table-wrapper">
 <table>
 <thead><tr><th>AIKA</th><th>AUTO</th><th>REITTI</th><th>MATKUSTAJA</th><th>PUHELIN</th><th>TILAAJA</th><th>HINTA</th><th>LASKU</th><th>HUOMIO</th><th>POIKKEAMA</th><th>TOIMINNOT</th></tr></thead>
 <tbody id="logs"></tbody>

<script type="module">
 import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
 import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
 import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
 const firebaseConfig = { 
 apiKey: "AIzaSyBVPk5FmqbVmirWpjnTQswfNDoUK2SoWzs", 
 authDomain: "jsailing-f716c.firebaseapp.com", 
 projectId: "jsailing-f716c", 
 storageBucket: "jsailing-f716c.firebasestorage.app", 
 appId: "1:543523103696:web:439a312efa6aec398a8fd5" 
 };
 const app = initializeApp(firebaseConfig);
 const db = getFirestore(app);
 const auth = getAuth(app);
 const ALLOWED_EMAIL = "jacke.seilaa@gmail.com";
 // Google Sheets -synkkaus (Apps Script -web-sovelluksen osoite). Tyhjä = synkkaus pois päältä.
 const SHEET_URL = "https://script.google.com/macros/s/AKfycbyrAQOUO0a1arB09H4ItiCJTgCGD2-cOpIXiWYg-B8A54D4A1KLPoNy-paFZPEDTC3C/exec";
 const SYNC_KEY = "kk_sheet_queue";
 function loadQueue() { try { return JSON.parse(localStorage.getItem(SYNC_KEY) || "[]"); } catch (e) { return []; } }
 function saveQueue(q) { try { localStorage.setItem(SYNC_KEY, JSON.stringify(q)); } catch (e) {} }
 let syncRunning = false;
 async function flushSheetQueue() {
 if (!SHEET_URL || syncRunning || !auth.currentUser) return;
 syncRunning = true;
 try {
 let q = loadQueue();
 while (q.length) {
 const item = q[0];
 let res;
 try {
 const idToken = await auth.currentUser.getIdToken();
 const r = await fetch(SHEET_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: item.action, idToken: idToken, order: item.order }) });
 res = await r.json();
 } catch (e) { res = { ok: false, error: e.message }; }
 if (!res.ok) { showError("Taulukkoon tallennus epäonnistui (yritetään uudelleen): " + (res.error || "ei yhteyttä")); break; }
 q = loadQueue(); q.shift(); saveQueue(q);
 }
 } finally { syncRunning = false; }
 }
 function queueSheet(action, order) {
 if (!SHEET_URL) return;
 const q = loadQueue();
 q.push({ action: action, order: order });
 saveQueue(q);
 flushSheetQueue();
 }
 let currentLogs = [];
 let editId = null;
 let exportMode = 'today';
 let unsubSnapshot = null;

 // ===== AUTENTIKOINTI =====
 document.getElementById('btnLogin')?.addEventListener('click', async () => {
     const provider = new GoogleAuthProvider();
     try {
         await signInWithPopup(auth, provider);
     } catch (e) {
         if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
             try { await signInWithRedirect(auth, provider); }
             catch (e2) { document.getElementById('auth-error').textContent = 'Kirjautuminen epäonnistui: ' + e2.message; }
         } else {
             document.getElementById('auth-error').textContent = 'Kirjautuminen epäonnistui: ' + e.message;
         }
     }
 });

 getRedirectResult(auth).catch((e) => {
     if (e && e.code && e.code !== 'auth/no-current-user') {
         document.getElementById('auth-error').textContent = 'Kirjautuminen epäonnistui: ' + e.message;
     }
 });

 onAuthStateChanged(auth, (user) => {
     if (user && user.email === ALLOWED_EMAIL) {
         document.getElementById('auth-overlay').style.display = 'none';
         document.getElementById('app-root').style.display = 'block';
         flushSheetQueue();
         if (!unsubSnapshot) {
             unsubSnapshot = onSnapshot(collection(db, "taksitulot"), (snap) => {
                 console.log("✅ Firestore-data vastaanotettu, rivejä:", snap.docs.length);
                 currentLogs = snap.docs.map(d => ({id: d.id, ...d.data()}));
                 renderTable();
             }, (error) => {
                 console.error("❌ Firestore-virhe:", error);
                 showError("Tietokantavirhe: " + error.message);
             });
         }
     } else if (user && user.email !== ALLOWED_EMAIL) {
         signOut(auth);
         document.getElementById('auth-error').textContent = 'Pääsy estetty. Vain ' + ALLOWED_EMAIL + ' voi kirjautua.';
     } else {
         document.getElementById('auth-overlay').style.display = 'flex';
         document.getElementById('app-root').style.display = 'none';
         if (unsubSnapshot) { unsubSnapshot(); unsubSnapshot = null; }
     }
 });
 console.log("🔧 Firestore listener asetettu, odotetaan dataa...");
 const RIDE_GRACE_MIN = 60;
 setInterval(() => { if (currentLogs && currentLogs.length) renderTable(); }, 60000);
 function renderTable() {
 console.log("🎨 renderTable() kutsuttu, currentLogs.length =", currentLogs.length);
 document.getElementById('dataCount').textContent = currentLogs.length;
 const today = new Date();
 today.setHours(0,0,0,0);
 const tbody = document.getElementById('logs');
 tbody.innerHTML = '';
 const sorted = [...currentLogs].sort((a, b) => {
 const dateA = parseFinnishDate(a.date);
 const dateB = parseFinnishDate(b.date);
 if (!dateA || !dateB) return 0;
 if (dateB - dateA !== 0) return dateB - dateA;
 return (b.time || '').localeCompare(a.time || '');
 });
 sorted.forEach(r => {
 const tr = document.createElement('tr');
 const phoneLink = r.phone ? `<a href="tel:${escapeHtml(r.phone)}">${escapeHtml(r.phone)}</a>` : '-';
 const fromLink = r.from ? `<a href="https://maps.google.com/?q=${encodeURIComponent(r.from)}" target="_blank">${escapeHtml(r.from)}</a>` : '-';
 const toLink = r.to ? `<a href="https://maps.google.com/?q=${encodeURIComponent(r.to)}" target="_blank">${escapeHtml(r.to)}</a>` : '-';
 tr.innerHTML = `
 <td><b>${escapeHtml(r.date || '-')}</b><br>${escapeHtml(r.time || '-')}</td>
 <td>${escapeHtml(r.car || '-')}</td>
 <td>${fromLink}<br>${toLink}</td>
 <td>${escapeHtml(r.customer || '-')}</td>
 <td>${phoneLink}</td>
 <td>${escapeHtml(r.orderer || '-')}</td>
 <td><span class="price-tag">${escapeHtml(r.price || '0')}€</span></td>
 <td>${escapeHtml(r.billing || '-')}</td>
 <td>${escapeHtml(r.notes || '-')}</td>
 <td>${escapeHtml(r.deviation || '-')}</td>
 <td>
 <button class="action-btn" onclick="window.prepareEdit('${r.id}')">✎</button>
 <button class="action-btn del-btn" onclick="window.deleteEntry('${r.id}')">X</button>
 </td>`;
 const rowDate = parseFinnishDate(r.date);
 let isExpired = rowDate && rowDate < today;
 const tm = String(r.time || '').match(/(\d{1,2})[.:](\d{2})/);
 if (rowDate && !isExpired && tm) {
 // Korostus pysyy kunnes alkamisajasta on kulunut RIDE_GRACE_MIN (keikka voi olla kesken)
 const startMs = new Date(rowDate.getFullYear(), rowDate.getMonth(), rowDate.getDate(), +tm[1], +tm[2]).getTime();
 if (Date.now() > startMs + RIDE_GRACE_MIN * 60000) isExpired = true;
 }
 if (rowDate && !isExpired) {
 tr.style.backgroundColor = '#2a5a2a';
 tr.style.color = '#00ff00';
 } else {
 tr.style.backgroundColor = '#000000';
 tr.style.color = '#ffffff';
 }
 tbody.appendChild(tr);
 });
 }
 function escapeHtml(text) {
 if (!text) return '';
 const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
 return String(text).replace(/[&<>"']/g, m => map[m]);
 }
 function showError(msg) {
 const errorDiv = document.getElementById('errorMsg');
 errorDiv.innerHTML = `<div class="error-msg">⚠️ ${escapeHtml(msg)}</div>`;
 errorDiv.style.display = 'block';
 setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
 }
 document.getElementById('btnSave').onclick = async () => {
 try {
 const data = {
 date: document.getElementById('inPvm').value.trim(), 
 time: document.getElementById('inKlo').value.trim(),
 car: document.getElementById('inAuto').value.trim(), 
 price: document.getElementById('inHinta').value.trim(),
 type: document.getElementById('inTyyppi').value.trim(), 
 from: document.getElementById('inFrom').value.trim(),
 to: document.getElementById('inTo').value.trim(), 
 customer: document.getElementById('inNimi').value.trim(),
 phone: document.getElementById('inPuhelin').value.trim(), 
 orderer: document.getElementById('inTilaaja').value.trim(),
 billing: document.getElementById('inLasku').value.trim(), 
 notes: document.getElementById('inHuomio').value.trim(),
 deviation: document.getElementById('inPoikkeama').value.trim()
 };
 if (!data.date) {
 showError("Päivämäärä pakollinen (pp.kk.yyyy)");
 return;
 }
 if (!validateFinnishDate(data.date)) {
 showError("Virheellinen päivämäärä. Käytä muotoa pp.kk.yyyy");
 return;
 }
 if (!data.car) {
 showError("Auto pakollinen (esim. 485 tai SMB)");
 const carEl = document.getElementById('inAuto');
 carEl.focus();
 carEl.classList.remove('flash-missing');
 void carEl.offsetWidth;
 carEl.classList.add('flash-missing');
 carEl.addEventListener('animationend', () => carEl.classList.remove('flash-missing'), { once: true });
 return;
 }
 if (!data.price) {
 showError("Hinta pakollinen");
 return;
 }
 if (isNaN(parseFloat(data.price))) {
 showError("Hinta pitää olla numero");
 return;
 }
 if (editId) { 
 const savedId = editId;
 await updateDoc(doc(db, "taksitulot", savedId), data); 
 cancelEdit(); 
 queueSheet("upsert", Object.assign({ id: savedId }, data));
 } else { 
 const ref = await addDoc(collection(db, "taksitulot"), data); 
 queueSheet("upsert", Object.assign({ id: ref.id }, data));
 }
 clearForm();
 } catch (error) {
 showError("Tallennusvirhe: " + error.message);
 console.error(error);
 }
 };
 function validateFinnishDate(dateStr) {
 if (!dateStr) return false;
 const match = dateStr.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
 if (!match) return false;
 const day = parseInt(match[1], 10);
 const month = parseInt(match[2], 10);
 const year = parseInt(match[3], 10);
 if (month < 1 || month > 12) return false;
 if (day < 1 || day > 31) return false;
 if (year < 2020 || year > 2100) return false;
 const date = new Date(year, month - 1, day);
 return date.getMonth() === month - 1 && date.getDate() === day;
 }
 window.prepareEdit = (id) => {
 const r = currentLogs.find(l => l.id === id);
 if (!r) {
 showError("Tilausta ei löydy");
 return;
 }

 document.getElementById('shiftFrom').value = shiftFmt(mon);
 document.getElementById('shiftTo').value = shiftFmt(today);
 shiftRows = [];
 renderShiftList();
 document.getElementById('shiftModal').classList.add('active');
 };
 window.closeShiftModal = () => document.getElementById('shiftModal').classList.remove('active');
 const shiftMsg = (t) => { const el = document.getElementById('shiftMsg'); el.textContent = t || ''; el.style.display = t ? 'block' : 'none'; };
 window.loadShifts = async () => {
 shiftMsg('');
 const f = parseFinnishDate(document.getElementById('shiftFrom').value.trim());
 const t = parseFinnishDate(document.getElementById('shiftTo').value.trim());
 if (!f || !t || f > t) { shiftMsg('Anna alku- ja loppupäivä muodossa pp.kk.vvvv'); return; }
 try {
 const idToken = await auth.currentUser.getIdToken();
 const resp = await fetch(SHEET_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'shifts', idToken: idToken, from: shiftIso(f), to: shiftIso(t) }) });
 const jr = await resp.json();
 if (!jr || !jr.ok || !Array.isArray(jr.shifts)) { shiftMsg('Sheets ei palauttanut vuoroja' + (jr && jr.error ? ': ' + jr.error : '') + '.'); return; }
 shiftRows = jr.shifts.map(s => ({ date: s.date, car: String(s.car || ''), brutto: Number(s.brutto) || 0, start: s.start || '', end: s.end || '', billed: s.billed || '', on: (Number(s.brutto) || 0) > 0 && !s.billed }));
 if (shiftRows.length === 0) shiftMsg('Ei ajovuoroja valitulla aikavälillä.');
 renderShiftList();
 } catch (e) { console.error(e); shiftMsg('Haku epäonnistui: ' + e.message); }
 };
 const renderShiftList = () => {
 const box = document.getElementById('shiftList');
 box.textContent = '';
 shiftRows.forEach((r, i) => {
 const d = shiftIsoToDate(r.date);
 const lab = document.createElement('label');
 lab.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px;';
 const cb = document.createElement('input');
 cb.type = 'checkbox'; cb.checked = r.on; cb.style.width = 'auto';
 cb.onchange = () => { r.on = cb.checked; renderShiftSummary(); };
 const txt = document.createElement('span');
 let s = shiftWd[d.getDay()] + ' ' + shiftFmt(d).slice(0, 5) + ' · auto ' + r.car + ' · ' + (r.start || '?') + '–' + (r.end || '?') + ' · ' + shiftEur(r.brutto);
 if (r.brutto <= 0) s += ' ⚠ ei kassaa';
 if (r.billed) s += ' (laskutettu: ' + r.billed + ')';
 txt.textContent = s;
 lab.appendChild(cb); lab.appendChild(txt); box.appendChild(lab);
 });
 renderShiftSummary();
 };
 const renderShiftSummary = () => {
 const sel = shiftRows.filter(r => r.on);
 const box = document.getElementById('shiftSummary');
 document.getElementById('shiftDl').disabled = sel.length === 0;
 if (sel.length === 0) { box.style.display = 'none'; return; }
 const s = buildShiftSummary(sel);
 box.style.display = 'block';
 box.textContent = 'Valittu ' + sel.length + ' vuoroa · bruttokassa ' + shiftEur(s.brutto) + ' · palkkio (alv 0 %) ' + shiftEur(s.palkkio) + ' · alv ' + SHIFT_ALV_LASKU.toString().replace('.', ',') + ' % ' + shiftEur(s.alv) + ' · laskun summa ' + shiftEur(s.total);
 };
 window.downloadShiftXlsx = async () => {
 try {
 const sel = shiftRows.filter(r => r.on);
 if (sel.length === 0) return;
 const s = buildShiftSummary(sel);
 const d0 = shiftIsoToDate(sel[0].date), d1 = shiftIsoToDate(sel[sel.length - 1].date);
 const fname = 'erittely_ajovuorot_' + sel[0].date + '_' + sel[sel.length - 1].date;
 const saveBlob = (blob, name) => { const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = name; link.click(); setTimeout(() => URL.revokeObjectURL(url), 100); };
 const csvFallback = () => {
 let csv = '﻿Pvm;Pv;Auto;Bruttokassa;Kassa alv 0 %;Palkkio 55 %\n';
 s.lines.forEach(l => { const dd = shiftIsoToDate(l.date); csv += [shiftFmt(dd), shiftWd[dd.getDay()], l.car, l.brutto.toFixed(2).replace('.', ','), l.alv0.toFixed(2).replace('.', ','), l.palkkio.toFixed(2).replace('.', ',')].join(';') + '\n'; });
 csv += ';;Yhteensä;' + s.brutto.toFixed(2).replace('.', ',') + ';' + s.alv0.toFixed(2).replace('.', ',') + ';' + s.palkkio.toFixed(2).replace('.', ',') + '\n';
 csv += ';;Alv ' + SHIFT_ALV_LASKU + ' %;;;' + s.alv.toFixed(2).replace('.', ',') + '\n;;Laskun summa;;;' + s.total.toFixed(2).replace('.', ',') + '\n';
 saveBlob(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), fname + '.csv');
 };
 const makeXlsx = async () => {
 const wb = new ExcelJS.Workbook();
 const ws = wb.addWorksheet('Ajovuorot');
 const eur = '#,##0.00 "€"';
 ws.getCell('A1').value = 'Ajovuorojen erittely – ' + shiftFmt(d0) + '–' + shiftFmt(d1);
 ws.getCell('A1').font = { bold: true, size: 14 };
 ws.getCell('A2').value = 'Laskuttaja: AJarmo Oy  ·  Laskutettava: Taksipalvelu Simonen';
 ws.getCell('A2').font = { color: { argb: 'FF555555' } };
 const hdr = ['Pvm', 'Pv', 'Auto', 'Bruttokassa (sis. alv ' + String(SHIFT_ALV_KASSA).replace('.', ',') + ' %)', 'Kassa alv 0 %', 'Palkkio ' + SHIFT_OSUUS + ' %'];
 const hr = ws.getRow(4); hr.height = 32;
 hdr.forEach((h, i) => { const c = hr.getCell(i + 1); c.value = h; c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F3A5F' } }; c.alignment = { wrapText: true, horizontal: 'center', vertical: 'middle' }; });
 let r = 5;
 s.lines.forEach(l => {
 const dd = shiftIsoToDate(l.date);
 const row = ws.getRow(r++);
 [new Date(Date.UTC(dd.getFullYear(), dd.getMonth(), dd.getDate())), shiftWd[dd.getDay()], /^\d+$/.test(l.car) ? Number(l.car) : l.car, l.brutto, l.alv0, l.palkkio].forEach((v, i) => {
 const c = row.getCell(i + 1); c.value = v;
 c.border = { bottom: { style: 'thin', color: { argb: 'FFCCCCCC' } } };
 if (i === 0) c.numFmt = 'd.m.yyyy';
 if (i >= 3) c.numFmt = eur;
 if (i === 1 || i === 2) c.alignment = { horizontal: 'center' };
 });
 });
 const tr = ws.getRow(r++);
 tr.getCell(4).value = s.brutto; tr.getCell(5).value = s.alv0;
 [4, 5].forEach(i => { tr.getCell(i).numFmt = eur; });
 for (let i = 1; i <= 6; i++) { tr.getCell(i).font = { bold: true }; tr.getCell(i).border = { top: { style: 'medium' } }; }
 [['Yhteensä (alv 0 %)', s.palkkio], ['Alv ' + String(SHIFT_ALV_LASKU).replace('.', ',') + ' %', s.alv], ['Laskun summa (sis. alv)', s.total]].forEach(([lab, v]) => {
 const row = ws.getRow(r++);
 row.getCell(1).value = lab; row.getCell(1).font = { bold: true };
 const c = row.getCell(6); c.value = v; c.numFmt = eur; c.font = { bold: true };
 });
 r++;
 ws.getCell('A' + r).value = 'Palkkio = päivän bruttokassa ÷ ' + (1 + SHIFT_ALV_KASSA / 100).toFixed(3).replace('.', ',') + ' × ' + SHIFT_OSUUS + ' %. Kassa on päivän kassasumma, johon sisältyy alv ' + String(SHIFT_ALV_KASSA).replace('.', ',') + ' %.';
 ws.getCell('A' + r).font = { italic: true, color: { argb: 'FF555555' } };
 [11, 5, 7, 22, 14, 14].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
 ws.pageSetup = { orientation: 'landscape', fitToPage: true };
 const buf = await wb.xlsx.writeBuffer();
 saveBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fname + '.xlsx');
 };
 if (window.ExcelJS) { makeXlsx().catch(e => { console.error(e); csvFallback(); }); return; }
 const sc = document.createElement('script');
 sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
 sc.onload = () => { makeXlsx().catch(e => { console.error(e); csvFallback(); }); };
 sc.onerror = () => csvFallback();
 document.head.appendChild(sc);
 } catch (e) { console.error(e); shiftMsg('Excelin teko epäonnistui: ' + e.message); }
 };
 /* ===== /Laskuliite ===== */
 document.getElementById('btnSetSMB').onclick = () => {
 document.getElementById('inAuto').value = "SMB"; 
 document.getElementById('inPvm').value = new Date().toLocaleDateString('fi-FI'); 
 };
 window.downloadAllCSV = () => {
 console.log("📥 Ladataan KAIKKI CSV, currentLogs.length =", currentLogs.length);
 if (!currentLogs || currentLogs.length === 0) {
 alert('⚠️ Ei dataa ladattavaksi');
 return;
 }
 generateCSV(currentLogs);
 };
</script>
