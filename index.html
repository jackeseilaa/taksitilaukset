<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Kuljetuskirja V37.5</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; padding: 20px; }
        .auto-tag { background: #fff; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div id="status">Haetaan tietoja...</div>
    <div id="logs"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Alustetaan Firebase ILMAN kirjautumista
    const db = getFirestore(initializeApp({ 
        apiKey: "AIzaSyBVPk5FmqbVmirWpjnTQswfNDoUK2SoWzs", 
        authDomain: "jsailing-f716c.firebaseapp.com", 
        projectId: "jsailing-f716c", 
        storageBucket: "jsailing-f716c.firebasestorage.app", 
        appId: "1:543523103696:web:439a312efa6aec398a8fd5" 
    }));

    // Haetaan data suoraan, ei kirjautumisia
    onSnapshot(collection(db, "taksitulot"), (snap) => {
        document.getElementById('status').innerText = "Data haettu onnistuneesti!";
        let html = '<table>';
        snap.forEach(doc => {
            const r = doc.data();
            html += `<tr>
                <td>${r.date || ''}</td>
                <td>${r.from || ''} ⮕ ${r.to || ''}</td>
                <td><span class="auto-tag">${r.auto || r.vehicle || '-'}</span></td>
            </tr>`;
        });
        document.getElementById('logs').innerHTML = html + '</table>';
    }, (err) => {
        document.getElementById('status').innerText = "Virhe: " + err.message;
        console.error(err);
    });
</script>
</body>
</html>
