<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuljetuskirja V36.9</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --surface: #111; --border: #333; --accent: #c8f050; --text: #fff; }
        body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); padding: 10px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 1.2rem; text-align: center; color: var(--accent); margin-bottom: 10px; }
        textarea { width: 100%; background: var(--surface); border: 2px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; margin-bottom: 10px; min-height: 80px; }
        .manual-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; background: #1a1a1a; padding: 10px; border-radius: 8px; }
        .manual-fields input { background: #000; border: 1px solid #555; color: #fff; padding: 10px; border-radius: 4px; width: 100%; }
        .btn-add { background: var(--accent); color: #000; width: 100%; padding: 15px; border-radius: 8px; font-weight: 900; border: none; cursor: pointer; }
        .btn-spec { background: #0044ff; color: #fff; width: 100%; padding: 15px; border-radius: 8px; border: none; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <h1>KULJETUSKIRJA</h1>

    <textarea id="msgInput" placeholder="LIITÄ VIESTI TÄHÄN..." oninput="parseMessage()"></textarea>
    
    <div class="manual-fields">
        <input type="text" id="inPvm" placeholder="Pvm">
        <input type="text" id="inKlo" placeholder="Klo">
        <input type="text" id="inAuto" placeholder="Auto" style="grid-column: span 2;">
        <input type="text" id="inFrom" placeholder="Lähtö" style="grid-column: span 2;">
        <input type="text" id="inTo" placeholder="Meno" style="grid-column: span 2;">
        <input type="text" id="inNimi" placeholder="Matkustaja" style="grid-column: span 2;">
        <input type="text" id="inHinta" placeholder="Hinta">
        <input type="text" id="inLasku" placeholder="Lasku">
    </div>

    <button class="btn-add" id="btnSave">TALLENNA TILAUS</button>
    <button class="btn-spec" onclick="exportSpecification()">Lataa erittely (CSV)</button>

    <table id="logsTable"><tbody id="logs"></tbody></table>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBVPk5FmqbVmirWpjnTQswfNDoUK2SoWzs", authDomain: "jsailing-f716c.firebaseapp.com", projectId: "jsailing-f716c", storageBucket: "jsailing-f716c.firebasestorage.app", appId: "1:543523103696:web:439a312efa6aec398a8fd5" }));
    
    let currentLogs = [];

    onSnapshot(collection(db, "taksitulot"), (snap) => {
        currentLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const tbody = document.getElementById('logs');
        tbody.innerHTML = '';
        currentLogs.forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${r.date}</b><br>${r.time}</td><td>${r.from}<br>${r.to}</td><td>${r.price}€</td>`;
            tbody.appendChild(tr);
        });
    });

    window.parseMessage = () => {
        const txt = document.getElementById('msgInput').value;
        // Tähän tulee se alkuperäinen logiikkasi viestin pilkkomiseen
    };

    document.getElementById('btnSave').onclick = async () => {
        await addDoc(collection(db, "taksitulot"), {
            date: document.getElementById('inPvm').value,
            time: document.getElementById('inKlo').value,
            auto: document.getElementById('inAuto').value,
            from: document.getElementById('inFrom').value,
            to: document.getElementById('inTo').value,
            customer: document.getElementById('inNimi').value,
            price: document.getElementById('inHinta').value,
            billing: document.getElementById('inLasku').value
        });
        alert("Tallennettu!");
    };

    window.exportSpecification = () => {
        let csv = "\uFEFFPvm;Klo;Auto;Matkustaja;Reitti;Hinta\n";
        currentLogs.forEach(r => {
            const vehicle = (r.auto || "").trim();
            if (vehicle !== "" && !/^\d+$/.test(vehicle)) {
                csv += `${r.date};${r.time};${vehicle};${r.customer};${r.from}-${r.to};${r.price}\n`;
            }
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = "erittely.csv";
        link.click();
    };
</script>
</body>
</html>
