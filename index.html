<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuljetuskirja V36.9.1</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --surface: #111; --border: #333; --accent: #c8f050; --accent2: #50c8f0; --text: #fff; --price-bg: #ff0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); padding: 10px; }
        
        /* OSOITETTU KELLO-OTSIKKO */
        .header-meta { color: #888; font-size: 10px; text-align: center; text-transform: uppercase; margin-bottom: 5px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 1.2rem; text-align: center; color: var(--accent); margin-bottom: 10px; letter-spacing: 2px; }
        
        textarea { width: 100%; background: var(--surface); border: 2px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; margin-bottom: 10px; min-height: 80px; }
        .manual-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; background: #1a1a1a; padding: 10px; border-radius: 8px; }
        .manual-fields input { background: #000; border: 1px solid #555; color: #fff; padding: 10px; border-radius: 4px; width: 100%; }
        .full-width { grid-column: span 2; }
        
        .btn-add { background: var(--accent); color: #000; width: 100%; padding: 15px; border-radius: 8px; font-weight: 900; border: none; cursor: pointer; margin-bottom: 10px; }
        .btn-spec { background: #0044ff; color: #fff; width: 100%; padding: 15px; border-radius: 8px; border: none; cursor: pointer; margin-bottom: 15px; }
        
        .table-wrapper { overflow-x: auto; background: var(--surface); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        td, th { padding: 10px; border-bottom: 1px solid #333; }
        .auto-display { background: #fff; color: #000; padding: 4px 8px; border-radius: 4px; font-weight: 900; display: inline-block; }
    </style>
</head>
<body>

    <div class="header-meta" id="statusHeader">VERSIO 36.9.1 | PÄIVITETTY: --:--</div>
    <h1>KULJETUSKIRJA</h1>

    <textarea id="msgInput" placeholder="LIITÄ VIESTI TÄHÄN..." oninput="parseMessage()"></textarea>
    
    <div class="manual-fields">
        <div><label style="font-size:9px">Pvm</label><input type="text" id="inPvm"></div>
        <div><label style="font-size:9px">Klo</label><input type="text" id="inKlo"></div>
        <div class="full-width"><label style="font-size:9px">Auto</label><input type="text" id="inAuto"></div>
        <div class="full-width"><label style="font-size:9px">Lähtö - Meno</label><input type="text" id="inFrom"></div>
        <div class="full-width"><label style="font-size:9px">Matkustaja</label><input type="text" id="inNimi"></div>
        <div><label style="font-size:9px">Hinta (€)</label><input type="text" id="inHinta"></div>
        <div><label style="font-size:9px">Lasku</label><input type="text" id="inLasku"></div>
    </div>

    <button class="btn-add" id="btnSave">TALLENNA TILAUS</button>
    <button class="btn-spec" onclick="exportSpecification()">Lataa erittely (vain tekstitunnukset)</button>

    <div class="table-wrapper">
        <table id="logsTable">
            <thead><tr><th>AIKA / AUTO</th><th>REITTI</th><th>MATKUSTAJA</th><th>HINTA</th></tr></thead>
            <tbody id="logs"></tbody>
        </table>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBVPk5FmqbVmirWpjnTQswfNDoUK2SoWzs", authDomain: "jsailing-f716c.firebaseapp.com", projectId: "jsailing-f716c", storageBucket: "jsailing-f716c.firebasestorage.app", appId: "1:543523103696:web:439a312efa6aec398a8fd5" }));
    
    let currentLogs = [];

    // DATA HAKU JA KELLON PÄIVITYS
    onSnapshot(query(collection(db, "taksitulot")), (snap) => {
        const now = new Date();
        document.getElementById('statusHeader').innerText = `VERSIO 36.9.1 | PÄIVITETTY: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        
        currentLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const tbody = document.getElementById('logs');
        tbody.innerHTML = '';
        currentLogs.forEach(r => {
            const tr = document.createElement('tr');
            const vehicle = (r.vehicle || r.auto || "-");
            tr.innerHTML = `<td><b>${r.date}</b><br>${r.time}<br><div class="auto-display">${vehicle}</div></td><td>${r.from}<br>⬇<br>${r.to}</td><td>${r.customer}</td><td>${r.price}€<br>${r.billing}</td>`;
            tbody.appendChild(tr);
        });
    });

    // ERITTELY-SUODATIN
    window.exportSpecification = () => {
        let csv = "\uFEFFPvm;Klo;Auto;Matkustaja;Reitti;Hinta\n";
        currentLogs.forEach(r => {
            const vehicle = (r.vehicle || r.auto || "").trim();
            // Suodatin: Ota mukaan vain jos sisältää muutakin kuin numeroita
            if (vehicle !== "" && !/^\d+$/.test(vehicle)) {
                csv += `${r.date};${r.time};${vehicle};${r.customer};${r.from}-${r.to};${r.price}\n`;
            }
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "erittely_tekstitunnuksilla.csv";
        link.click();
    };

    window.parseMessage = () => { /* Ennallaan */ };
    window.btnSave.onclick = () => { /* Ennallaan */ };
</script>
</body>
</html>
