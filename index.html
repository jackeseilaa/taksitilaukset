<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuljetuskirja V37.12</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --surface: #111; --border: #333; --accent: #c8f050; --accent2: #50c8f0; --text: #fff; --edit-accent: #80ff80; }
        * { box-sizing: border-box; }
        body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); padding: 10px; }
        .v-tag { color: #888; font-size: 11px; text-align: center; margin-bottom: 5px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 1.2rem; text-align: center; color: var(--accent); margin-bottom: 10px; }
        textarea { width: 100%; background: var(--surface); border: 2px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px; margin-bottom: 10px; min-height: 80px; }
        .manual-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; background: #1a1a1a; padding: 12px; border-radius: 8px; }
        .manual-fields input { background: #000; border: 1px solid #555; color: #fff; padding: 10px; width: 100%; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .btn-add { background: var(--accent); color: #000; flex: 2; padding: 15px; border-radius: 8px; border: none; font-weight: 900; cursor: pointer; }
        .btn-csv { background: #333; color: white; padding: 10px; border-radius: 8px; border: 1px solid #555; cursor: pointer; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th { text-align: left; border-bottom: 2px solid var(--accent); padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        .price-tag { background: #ffff00; color: #000; padding: 2px 6px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="v-tag">VERSIO 37.12 (Tilaajan CSV-lisäys)</div>
    <h1>KULJETUSKIRJA</h1>

    <textarea id="msgInput" placeholder="LIITÄ VIESTI TÄHÄN..." oninput="parseMessage()"></textarea>
    
    <div class="manual-fields">
        <div><label>Pvm</label><input type="text" id="inPvm"></div>
        <div><label>Klo</label><input type="text" id="inKlo"></div>
        <div class="full-width"><label>Auto</label><input type="text" id="inAuto"></div>
        <div><label>Hinta (€)</label><input type="text" id="inHinta"></div>
        <div><label>Tyyppi</label><input type="text" id="inTyyppi"></div>
        <div class="full-width"><label>Lähtö</label><input type="text" id="inFrom"></div>
        <div class="full-width"><label>Meno</label><input type="text" id="inTo"></div>
        <div><label>Matkustaja</label><input type="text" id="inNimi"></div>
        <div><label>Lasku</label><input type="text" id="inLasku"></div>
        <div class="full-width"><label>Huomio</label><input type="text" id="inHuomio"></div>
    </div>

    <div class="btn-row">
        <button class="btn-add" id="btnSave">TALLENNA TILAUS</button>
        <button class="btn-csv" onclick="exportSubscriberCSV()" style="background: #8a2a50; border-color: #ff80a0;">LATAA TILAAJAN CSV</button>
        <button class="btn-csv" onclick="exportToCSV('today')">CSV - Tänään</button>
        <button class="btn-csv" onclick="clearForm()">TYHJENNÄ</button>
    </div>

    <table><thead><tr><th>Pvm/Klo</th><th>Reitti</th><th>Kyydissä</th><th>Laskutus</th><th>Hinta</th><th>Auto/Huom</th></tr></thead><tbody id="logs"></tbody></table>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBVPk5FmqbVmirWpjnTQswfNDoUK2SoWzs", authDomain: "jsailing-f716c.firebaseapp.com", projectId: "jsailing-f716c", storageBucket: "jsailing-f716c.firebasestorage.app", appId: "1:543523103696:web:439a312efa6aec398a8fd5" }));
    
    let currentLogs = [];

    onSnapshot(collection(db, "taksitulot"), (snap) => {
        currentLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const tbody = document.getElementById('logs');
        tbody.innerHTML = '';
        currentLogs.sort((a,b) => b.date.localeCompare(a.date)).forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${r.date}</b><br>${r.time}</td><td>${r.from}<br>${r.to}</td><td>${r.customer}</td><td>${r.billing}</td><td><span class="price-tag">${r.price}€</span></td><td>${r.car}<br><small>${r.notes}</small></td>`;
            tbody.appendChild(tr);
        });
    });

    window.exportSubscriberCSV = () => {
        // Suodata: Auton on oltava muu kuin pelkkä numero
        const filtered = currentLogs.filter(r => {
            const car = (r.car || "").trim();
            return car !== "" && !/^\d+$/.test(car);
        });

        let csv = "\uFEFFPäivä;Aika;Mistä;Mihin;Kuka kyydissä;Ketä laskutetaan;Summa;Auto;Huomio\n";
        filtered.forEach(r => {
            csv += `${r.date};${r.time};${r.from};${r.to};${r.customer};${r.billing};${r.price};${r.car};${r.notes}\n`;
        });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = "tilaajan_ajoerittely.csv";
        link.click();
    };

    document.getElementById('btnSave').onclick = async () => {
        await addDoc(collection(db, "taksitulot"), {
            date: document.getElementById('inPvm').value, time: document.getElementById('inKlo').value,
            car: document.getElementById('inAuto').value, price: document.getElementById('inHinta').value,
            type: document.getElementById('inTyyppi').value, from: document.getElementById('inFrom').value,
            to: document.getElementById('inTo').value, customer: document.getElementById('inNimi').value,
            billing: document.getElementById('inLasku').value, notes: document.getElementById('inHuomio').value
        });
        alert("Tallennettu!");
    };

    window.clearForm = () => { document.querySelectorAll('input, textarea').forEach(i => i.value = ''); };
</script>
</body>
</html>
