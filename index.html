<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuljetuskirja V37.14</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #000000; --surface: #111111; --border: #333333; --accent: #c8f050; 
            --accent2: #50c8f0; --text: #ffffff; --muted: #aaaaaa; --price-bg: #ffff00; 
        }
        body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); padding: 10px; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .btn-add { background: var(--accent); color: black; flex: 2; padding: 20px; border-radius: 8px; font-weight: 900; border: none; cursor: pointer; }
        .btn-csv { background: #333; color: white; padding: 10px; border-radius: 8px; border: 1px solid #444; cursor: pointer; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; border-bottom: 2px solid var(--accent); padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        .price-tag { background: var(--price-bg); color: #000; padding: 2px 6px; font-weight: bold; }
    </style>
</head>
<body>

<h1>KULJETUSKIRJA</h1>
<div class="btn-row">
    <button class="btn-add" id="btnSave">TALLENNA TILAUS</button>
    <button class="btn-csv" onclick="exportSubscriberCSV()" style="background: #8a2a50; border-color: #ff80a0;">LATAA TILAAJAN CSV</button>
</div>

<table>
    <thead><tr><th>Pvm/Klo</th><th>Reitti</th><th>Kyydissä</th><th>Auto</th><th>Hinta</th></tr></thead>
    <tbody id="logs"></tbody>
</table>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBVPk5FmqbVmirWpjnTQswfNDoUK2SoWzs", authDomain: "jsailing-f716c.firebaseapp.com", projectId: "jsailing-f716c", storageBucket: "jsailing-f716c.firebasestorage.app", appId: "1:543523103696:web:439a312efa6aec398a8fd5" }));
    
    let currentLogs = [];

    // Ladataan data
    onSnapshot(collection(db, "taksitulot"), (snap) => {
        currentLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const tbody = document.getElementById('logs');
        tbody.innerHTML = '';
        currentLogs.forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${r.date}<br>${r.time}</td><td>${r.from}<br>${r.to}</td><td>${r.customer}</td><td>${r.car}</td><td><span class="price-tag">${r.price}€</span></td>`;
            tbody.appendChild(tr);
        });
        console.log("Data ladattu, rivejä:", currentLogs.length);
    });

    window.exportSubscriberCSV = () => {
        if (currentLogs.length === 0) {
            alert("Ei dataa ladattuna! Odota hetki tai tarkista yhteys.");
            return;
        }

        // Suodatus: Auto ei saa olla pelkkää numeroa
        const filtered = currentLogs.filter(r => {
            const car = (r.car || "").toString().trim();
            // Jos auto on tyhjä, poistetaan. Jos auto on pelkkiä numeroita, poistetaan.
            return car !== "" && !/^\d+$/.test(car);
        });

        console.log("Suodatettu määrä:", filtered.length);

        let csv = "\uFEFFPäivä;Aika;Mistä;Mihin;Kuka kyydissä;Ketä laskutetaan;Summa;Auto;Huomio\n";
        filtered.forEach(r => {
            csv += `${r.date || ''};${r.time || ''};${r.from || ''};${r.to || ''};${r.customer || ''};${r.billing || ''};${r.price || ''};${r.car || ''};${r.notes || ''}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "tilaajan_ajoerittely.csv";
        link.click();
    };
</script>
</body>
</html>
